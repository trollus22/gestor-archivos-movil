name: Build APK + IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────── ANDROID · APK ───────────────────────────
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        run: |
          # No usamos android-actions/setup-android: intenta instalar el paquete
          # 'tools', que ya no existe en el repositorio del SDK y hace fallar el job.
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=""
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then SM="$d/sdkmanager"; break; fi
          done
          echo "sdkmanager: $SM"
          test -n "$SM" || { echo "No se encontró sdkmanager en $SDK"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web
        run: npm run build

      - name: Sincronizar Capacitor (Android)
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p salida
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} salida/GestorArchivos.apk \;
          ls -la salida/

      - uses: actions/upload-artifact@v4
        with:
          name: GestorArchivos-APK
          path: salida/GestorArchivos.apk
          if-no-files-found: error

  # ──────────────────────────── iOS · IPA ──────────────────────────────
  ipa:
    name: iOS IPA (sin firmar)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web
        run: npm run build

      - name: Sincronizar Capacitor (iOS)
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Compilar .app sin firma
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Empaquetar .ipa
        run: |
          APP="ios/App/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "No se generó App.app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GestorArchivos.ipa Payload
          ls -la GestorArchivos.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GestorArchivos-IPA-sin-firmar
          path: GestorArchivos.ipa
          if-no-files-found: error
